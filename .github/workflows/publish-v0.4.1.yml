name: Publish RoamPrompt v0.4.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the reviewed v0.4.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v0.4.1 already exists."
            exit 0
          fi

          gh release create v0.4.1 \
            --repo "${{ github.repository }}" \
            --target 9a0f8fc9a404d21fa08247752d1df4546ba3b396 \
            --title "RoamPrompt v0.4.1" \
            --notes "Patch release for original-language quotation and wisdom titles, bilingual aliases, candidate provenance labelling, explicit interpretation labels, language-appropriate work-title punctuation, and prevention of nested Roam page links."
